<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>H2S Guard - Reset Password</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/register.css') }}"
    >

</head>


<body>


<div class="register-page">


    <div class="register-card">


        <a
            href="{{ url_for('login') }}"
            class="back"
        >
            ‹
        </a>


        <div class="logo">
            🔒
        </div>


        <h1>
            Reset Password
        </h1>


        <p class="subtitle">
            Create a new password
        </p>



        {% with messages = get_flashed_messages(
            with_categories=true
        ) %}

            {% if messages %}

                {% for category, message in messages %}

                    <div class="message {{ category }}">
                        {{ message }}
                    </div>

                {% endfor %}

            {% endif %}

        {% endwith %}



        <form
            method="POST"
            action="{{ url_for('forgot_password') }}"
        >


            <label>
                Email or Mobile Number
            </label>

            <input
                type="text"
                name="login_id"
                placeholder="Enter email or mobile"
                required
            >


            <label>
                New Password
            </label>

            <input
                type="password"
                name="new_password"
                placeholder="Minimum 6 characters"
                required
            >


            <label>
                Confirm New Password
            </label>

            <input
                type="password"
                name="confirm_password"
                placeholder="Confirm password"
                required
            >


            <button type="submit">

                Change Password

            </button>


        </form>


        <p class="login-link">

            Remember your password?

            <a href="{{ url_for('login') }}">
                Login
            </a>

        </p>


    </div>


</div>


</body>

</html>
