<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>H2S Guard - Manual Guidelines</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #f8faf9;
            color: #173e36;
            font-family: Arial, Helvetica, sans-serif;
        }

        .guidelines-page {
            width: min(1100px, 100%);
            min-height: 100vh;
            margin: 0 auto;
            padding: 24px;
        }

        .guidelines-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            margin-bottom: 18px;
        }

        .back-link,
        .download-link {
            color: #176c49;
            font-weight: 700;
            text-decoration: none;
        }

        .back-link {
            font-size: 30px;
        }

        .guidelines-header h1 {
            margin: 0;
            color: #176c49;
            font-size: clamp(24px, 4vw, 36px);
            text-align: center;
        }

        .download-link {
            padding: 12px 16px;
            border-radius: 8px;
            background: #29965a;
            color: white;
            white-space: nowrap;
        }

        .pdf-frame {
            width: 100%;
            height: calc(100vh - 125px);
            min-height: 560px;
            border: 1px solid #dce7e1;
            border-radius: 12px;
            background: white;
        }

        @media (max-width: 640px) {
            .guidelines-page {
                padding: 16px;
            }

            .guidelines-header {
                flex-wrap: wrap;
                justify-content: center;
            }

            .guidelines-header h1 {
                order: -1;
                width: 100%;
            }

            .pdf-frame {
                height: calc(100vh - 155px);
                min-height: 480px;
            }
        }
    </style>

</head>

<body>

    <main class="guidelines-page">

        <header class="guidelines-header">
            <a class="back-link" href="{{ url_for('home') }}" aria-label="Back to home">&#8249;</a>
            <h1>Manual Guidelines</h1>
            <a class="download-link" href="{{ url_for('download_guidelines') }}">Download PDF</a>
        </header>

        <iframe
            class="pdf-frame"
            src="{{ url_for('static', filename='pdf/user_guidelines.pdf') }}"
            title="H2S Guard user manual guidelines"
        ></iframe>

    </main>

</body>

</html>
