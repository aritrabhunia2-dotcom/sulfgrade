<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>H2S Guard - Register</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/register.css') }}"
    >

</head>


<body>


<div class="register-page">


    <div class="register-card">


        <a
            href="{{ url_for('login') }}"
            class="back"
        >
            ‹
        </a>


        <div class="logo">

            🛡

        </div>


        <h1>
            Create Account
        </h1>


        <p class="subtitle">
            Register for H2S Guard
        </p>



        {% with messages = get_flashed_messages(
            with_categories=true
        ) %}

            {% if messages %}

                {% for category, message in messages %}

                    <div class="message {{ category }}">
                        {{ message }}
                    </div>

                {% endfor %}

            {% endif %}

        {% endwith %}



        <form
            method="POST"
            action="{{ url_for('register') }}"
        >


            <label>
                Full Name
            </label>

            <input
                type="text"
                name="full_name"
                placeholder="Enter your full name"
                required
            >


            <label>
                Email
            </label>

            <input
                type="email"
                name="email"
                placeholder="Enter your email"
                required
            >


            <label>
                Mobile Number
            </label>

            <input
                type="tel"
                name="mobile"
                placeholder="Enter mobile number"
                required
            >


            <label>
                Designation
            </label>

            <input
                type="text"
                name="designation"
                placeholder="Enter your designation"
                required
            >


            <label>
                Shift
            </label>

            <select
                name="shift"
                required
            >

                <option value="" disabled selected>
                    Select your shift
                </option>

                <option value="Day (6:00 AM - 2:00 PM)">
                    Day (6:00 AM - 2:00 PM)
                </option>

                <option value="Evening (2:00 PM - 10:00 PM)">
                    Evening (2:00 PM - 10:00 PM)
                </option>

                <option value="Night (10:00 PM - 6:00 AM)">
                    Night (10:00 PM - 6:00 AM)
                </option>

            </select>


            <label>
                Password
            </label>

            <input
                type="password"
                name="password"
                placeholder="Minimum 6 characters"
                required
            >


            <label>
                Confirm Password
            </label>

            <input
                type="password"
                name="confirm_password"
                placeholder="Confirm your password"
                required
            >


            <button
                type="submit"
            >
                Create Account
            </button>


        </form>


        <p class="login-link">

            Already have an account?

            <a href="{{ url_for('login') }}">
                Login
            </a>

        </p>


    </div>


</div>


</body>

</html>
