services:
  web:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - ./:/app
    ports:
      - "3000:3000"
    environment:
      - FLASK_APP=app.py
      - FLASK_DEBUG=1
      - PORT=3000
      - PYTHONUNBUFFERED=1
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
      - BASE44_PUBLIC_HOST_SUFFIX
    command: >
      bash -c "
      apt-get update -qq && apt-get install -y -qq --no-install-recommends libgl1 libglib2.0-0 > /dev/null 2>&1 || true &&
      pip install --no-cache-dir -r requirements.txt &&
      flask run --host=0.0.0.0 --port=3000 --reload
      "
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:3000/')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
